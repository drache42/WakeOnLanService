name: Main Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build:
    uses: FroeFam/ci-pipeline/.github/workflows/build-test.yml@v1
    with:
      language: python
      python-version: "3.14"
      python-matrix: '["3.10","3.11","3.12","3.13","3.14"]'
      integration-test-platforms: '["linux/amd64","linux/arm64"]'
    secrets: inherit

  release:
    needs: build
    uses: FroeFam/ci-pipeline/.github/workflows/release.yml@v1
    with:
      registry: dockerhub
      image-namespace: drache42
      images: '[{"name":"wakeonlanservice","dockerfile":"docker/Dockerfile","context":".","platforms":["linux/amd64","linux/arm64"],"title":"WakeOnLanService"}]'
    secrets: inherit
