name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  build:
    uses: FroeFam/ci-pipeline/.github/workflows/build-test.yml@v1
    with:
      language: python
      python-version: "3.14"
      python-matrix: '["3.10","3.11","3.12","3.13","3.14"]'
      integration-test-platforms: '["linux/amd64","linux/arm64"]'
    secrets: inherit

  review:
    uses: FroeFam/ci-pipeline/.github/workflows/claude-review.yml@v1
    secrets: inherit

  check-build:
    name: Build and test
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check build result
        shell: pwsh
        run: if ('${{ needs.build.result }}' -notin 'success','skipped') { exit 1 }

  check-review:
    name: Review with Claude
    needs: review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check review result
        shell: pwsh
        run: if ('${{ needs.review.result }}' -notin 'success','skipped') { exit 1 }
