name: Label Gate

on:
  # opened/synchronize are omitted: they race with Classify PR. The gate
  # re-runs after Classify PR completes via workflow_run.
  pull_request:
    types: [labeled, unlabeled, reopened]
  workflow_run:
    workflows: ["Classify PR"]
    types: [completed]

concurrency:
  group: label-gate-${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  checks: write

jobs:
  gate:
    uses: FroeFam/ci-pipeline/.github/workflows/label-gate.yml@v1
    secrets: inherit

  check-gate:
    name: label-gate
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check gate result
        shell: pwsh
        run: if ('${{ needs.gate.result }}' -notin 'success','skipped') { exit 1 }
